name: publish-sample
on:
  workflow_dispatch:
    inputs:
      title:
        description: "عنوان الفيديو"
        default: ""
      caption:
        description: "الوصف"
        default: ""
      reciter:
        description: "معرّف القارئ"
        default: "ar.aymanswoaid"
      platforms:
        description: "المنصات (مفصولة بفواصل) أو all"
        default: "all"
      release_url:
        description: "رابط mp4 عام (اختياري)"
        default: ""
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install --quiet requests
      - name: publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_CAPTION: ${{ inputs.caption }}
          RELEASE_RECITER: ${{ inputs.reciter }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          RELEASE_URL: ${{ inputs.release_url }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python tools/release_sample.py
      - name: save state
        run: |
          git config user.name "nova-factory"
          git config user.email "dawshaxlol@gmail.com"
          git add state/
          git diff --cached --quiet || git commit -m "auto: sample watch state"
          git push
