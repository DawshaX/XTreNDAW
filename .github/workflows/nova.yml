name: NOVA — المصنع الذاتي (حلقة كل ساعة)

# الساعة: كل ساعة بيختار الموضوع التالي اللي لسه ما اتنتجش،
# ينتجه، يرفعه GitHub Releases، ويحدّث الذاكرة (produced.json) في git.
on:
  schedule:
    - cron: "7 * * * *"     # كل ساعة :07 UTC
  workflow_dispatch: {}     # زر يدوي للتجربة

concurrency:
  group: nova
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # عشان يعمل release + يحدّث الذاكرة

jobs:
  nova:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # مفاتيح اختيارية (لو مفيهاش المصنع بيكمّل إنتاج ويرفع، والنشر بيستنى)
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      OPENVERSE_TOKEN: ${{ secrets.OPENVERSE_TOKEN }}
      FREESOUND_ID: ${{ secrets.FREESOUND_ID }}
      FREESOUND_SECRET: ${{ secrets.FREESOUND_SECRET }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      XT_TOKEN_KEY: ${{ secrets.XT_TOKEN_KEY }}
      XT_YT: "1"   # يوتيوب شغال + ووتشدوج يحذف أي فيديو محظور خلال دقائق
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: المكتبات
        run: pip install -r requirements.txt

      - name: إنتاج الحلقة التالية + رفعها Releases
        continue-on-error: true
        run: |
          set +e
          timeout 2400 python -m xtrendaw.run_cycle --next
          rc=$?
          [ $rc -eq 42 ] && touch /tmp/skipflag
          exit $rc

      - name: تحديث الذاكرة في git (عشان الحلقة الجاية تكمل مش تعيد)
        if: always()
        run: |
          git config user.name  "XDAW NOVA factory"
          git config user.email "dawshaxlol@gmail.com"
          git add state/ \
                  content/topics.json content/din_stock.json || true
          git diff --cached --quiet || {
            git commit -m "auto: factory state $(date -u +%Y-%m-%dT%H:%MZ)"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase origin main || true
            git push
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}' || true
          }

      - name: سلسلة الساعة (لو الكرون نام — المصنع يصحي نفسه)
        if: always()
        run: |
          ts=$(python3 -c "import json; print(int(json.load(open('state/last_publish.json'))['ts']))" 2>/dev/null || echo 0)
          now=$(date +%s)
          delta=$((ts + 3600 - now))
          [ "$delta" -lt 60 ] && delta=60
          [ "$delta" -gt 3600 ] && delta=3600
          echo "ناعس $delta ثانية — فيديو جديد بعد ساعة بالظبط من آخر واحد"
          sleep "$delta"
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/nova.yml/dispatches" \
            -d '{"ref":"main"}' || true
