name: probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: probe
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          pip install -q requests
          python - <<'PY'
          import os, json, urllib.parse, urllib.request
          cid=os.environ.get("YOUTUBE_CLIENT_ID",""); csec=os.environ.get("YOUTUBE_CLIENT_SECRET",""); rt=os.environ.get("YOUTUBE_REFRESH_TOKEN","")
          print("client_id موجود:", bool(cid), "| عدد حروفه:", len(cid))
          print("رقم المشروع (public part):", cid.split("-")[0] if cid else "-")
          print("آخر 8 حروف من client_id:", cid[-8:] if cid else "-")
          print("بصمة سرّ العميل (SHA256 أول 8):", __import__("hashlib").sha256(csec.encode()).hexdigest()[:8] if csec else "-")
          print("بصمة التوكن (SHA256 أول 8):", __import__("hashlib").sha256(rt.encode()).hexdigest()[:8] if rt else "-")
          if not (cid and csec and rt):
              raise SystemExit("ناقص بيانات")
          data=urllib.parse.urlencode({"client_id":cid,"client_secret":csec,"refresh_token":rt,"grant_type":"refresh_token"}).encode()
          try:
              r=json.loads(urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=data),timeout=30).read())
          except Exception as e:
              raise SystemExit(f"✗ تجديد فشل: {e}")
          sc=r.get("scope","")
          print("الصلاحيات:", sc)
          print("الحذف مسموح؟", "youtube.force-ssl" in sc)
          tok=r["access_token"]
          try:
              ch=json.loads(urllib.request.urlopen(urllib.request.Request("https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&mine=true",headers={"Authorization":f"Bearer {tok}"}),timeout=30).read())
              for it in ch.get("items",[]):
                  print("القناة:", it["snippet"]["title"], "| ID:", it["id"], "| مشتركين:", it.get("statistics",{}).get("subscriberCount"))
          except Exception as e:
              print("✗ فحص القناة:", e)
          PY
