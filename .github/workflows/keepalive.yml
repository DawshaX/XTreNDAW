name: keepalive — منع تعطيل الجدولة بعد 60 يوم

# السبب: GitHub بيعطّل الـscheduled workflows بصمت بعد 60 يوم بلا نشاط
# في المستودعات العامة. أي commit هنا بيمنع ده.
on:
  schedule:
    - cron: "17 3 * * 0"   # كل أحد 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تحديث طابع النبض
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-active.txt
      - name: التزام
        run: |
          git config user.name  "XTreNDAW keepalive"
          git config user.email "dawshaxlol@gmail.com"
          git add .github/last-active.txt
          git diff --cached --quiet || git commit -m "chore: keepalive pulse"
          git push
