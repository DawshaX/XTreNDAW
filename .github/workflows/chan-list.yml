name: chan-list
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: كل القنوات المتاحة للتوكن ده
        env:
          C: ${{ secrets.YOUTUBE_CLIENT_ID }}
          S: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          R: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          pip install -q requests
          python - <<'PYEOF'
          import os, json, urllib.parse, urllib.request
          cid=os.environ["C"]; sec=os.environ["S"]; rt=os.environ["R"]
          d=urllib.parse.urlencode({"client_id":cid,"client_secret":sec,"refresh_token":rt,"grant_type":"refresh_token"}).encode()
          r=json.loads(urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=d),timeout=30).read())
          at=r["access_token"]
          print("الصلاحيات:", r.get("scope","")[:140])
          ch=json.loads(urllib.request.urlopen(urllib.request.Request(
              "https://www.googleapis.com/youtube/v3/channels?part=snippet,contentDetails&mine=true&maxResults=50",
              headers={"Authorization":f"Bearer {at}"}),timeout=30).read())
          items=ch.get("items",[])
          print("عدد القنوات المتاحة:", len(items))
          for it in items:
              print("  ·", it["snippet"]["title"], "|", it["id"])
          print("هل منها قناة نور (UCqsa-xL5a5Vm_jNaS5sGmkw)؟",
                any(i["id"]=="UCqsa-xL5a5Vm_jNaS5sGmkw" for i in items))
          PYEOF
